services:
  mysql:
    image: mysql:8.4
    container_name: zen-mysql-testbed
    environment:
      MYSQL_ROOT_PASSWORD: my-secret-pw
      MYSQL_DATABASE: petsitter
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-pmy-secret-pw"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - mysql-testbed-data:/var/lib/mysql

volumes:
  mysql-testbed-data: